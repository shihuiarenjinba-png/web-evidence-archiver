# Run unit regression and browser-aware readiness; never fabricate a Store identity.
name: Group C Web Evidence MSIX preflight
on:
  push:
    branches: ['codex/store-p0-web-evidence-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared requirements
        run: python -m pip install -r requirements.txt
      - name: Compile and execute source regressions
        shell: pwsh
        run: |
          python -m compileall -q app.py archiver.py store tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit regression failed' }
      - name: Report exact packaging blockers (not a build)
        shell: pwsh
        run: |
          python store/msix_preflight.py --json-out store-output/msix-preflight.json
          if ($LASTEXITCODE -ne 0) { throw 'MSIX preflight report failed to execute' }
          Get-Content store-output/msix-preflight.json
      - name: Keep audit report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-evidence-msix-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: store-output/msix-preflight.json
          if-no-files-found: error
          retention-days: 14

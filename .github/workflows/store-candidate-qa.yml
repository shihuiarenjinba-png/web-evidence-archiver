name: Store candidate regression
on:
  push:
    branches:
      - 'feature/store-paid-msix-quality-20261017'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full Python regression
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q app.py
      - name: Retain release HOLD
        run: echo "No official Product Identity, Windows installed MSIX, WACK or commercial release certification claimed."

name: Windows tests

on:
  push:
    branches:
      - codex/web-evidence-gui-progress-20261124
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @('setup.ps1', 'run.ps1', 'doctor.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file parse errors: $($errors -join '; ')" }
          }

      - name: Run supported setup and verification
        shell: pwsh
        run: |
          & .\setup.ps1 -PythonExecutable "$env:pythonLocation\python.exe" -ReportPath "$env:RUNNER_TEMP\setup-report.json"
          if ($LASTEXITCODE -ne 0) { throw 'setup.ps1 failed.' }

      - name: Verify launch from a different working directory
        shell: pwsh
        run: |
          $repo = (Resolve-Path $PWD).Path
          Set-Location $env:TEMP
          & (Join-Path $repo 'run.ps1') -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'run.ps1 path resolution failed.' }
          & (Join-Path $repo 'doctor.ps1') -SetupReportPath (Join-Path $env:RUNNER_TEMP 'setup-report.json') -ReportPath (Join-Path $env:RUNNER_TEMP 'doctor-report.json')
          if ($LASTEXITCODE -ne 0) { throw 'doctor.ps1 detected an incomplete setup.' }

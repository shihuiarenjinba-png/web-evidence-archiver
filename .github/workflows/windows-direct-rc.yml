name: windows-direct-rc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-direct:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build and verify direct EXE RC
        shell: pwsh
        run: ./build-windows-direct.ps1

      - name: Upload RC build outputs
        uses: actions/upload-artifact@v4
        with:
          name: web-evidence-archiver-windows-direct-rc
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
